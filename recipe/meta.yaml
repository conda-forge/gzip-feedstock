{% set name = "gzip" %}
{% set version = "1.15" %}

package:
  name: {{ name|lower }}
  version: "{{ version }}"

source:
  url: https://ftp.gnu.org/gnu/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 545886cf57fa88a65e967fbf705903d7fcb2567c82c7342493e82e8d7b1a210b
  patches:
    - 0001-build-avoid-failure-to-build-on-linux-aarch64.patch

build:
  number: 0
  skip: true  # [win]

requirements:
  build:
    - gnuconfig  # [unix]
    - {{ compiler('c') }}
    - {{ stdlib("c") }}
    - make

test:
  commands:
    - gzip --version

about:
  home: https://www.gnu.org/software/gzip/
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  summary: The GNU zip compression utility
  description: |
    gzip (GNU zip) is a compression utility designed to be a replacement
    for 'compress'. Its main advantages over compress are much better
    compression and freedom from patented algorithms.  The GNU Project
    uses it as the standard compression program for its system.
  doc_url: https://www.gnu.org/software/gzip/manual/gzip.html
  dev_url: https://savannah.gnu.org/projects/gzip/

extra:
  recipe-maintainers:
    - corneliusroemer
    - saraedum
